<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إشعار إغلاق التطبيق</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #121212);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px 20px;
      border-radius: 16px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #ff4d4d;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #e0e0e0;
    }

    .small {
      margin-top: 15px;
      font-size: 13px;
      color: #aaaaaa;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 20px;
      }
      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">⚠️</div>
    <h1>التطبيق مغلق</h1>
    <p>
      نود إعلامكم بأن هذا التطبيق قد تم إيقافه حالياً،  
      ولا توجد أي تحديثات جديدة في الوقت الحالي.
    </p>
    <p>
      نشكركم على دعمكم وتفهمكم.
    </p>

    <div class="small">
      جميع الحقوق محفوظة ©
    </div>
  </div>

</body>
</html>
